name: release

on:
  push:
    tags:
      - 'v0.2.0'

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: product
    steps:
      - name: Require public repository for provenance
        working-directory: ${{ github.workspace }}
        run: |
          if ("${{ github.event.repository.visibility }}" -ne "public") {
            throw "Publish the reviewed repository and enable public protections before pushing a release tag."
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrrrredy/runcase-interchange
          ref: 462fa2fa7cdaa8f58cd4c1dcc9cf778e1d2d0073
          path: protocol
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Build and check release commit
        run: |
          npm ci
          npm run check
      - name: Run release UI gate
        env:
          REW_UI_OUTPUT_DIR: ${{ runner.temp }}\runtime-ui-evidence
          REW_PROTOCOL_FIXTURE: ${{ github.workspace }}\protocol\examples\workflow.case.code.json
        run: |
          npx playwright install chromium
          npm run probe:ui
      - name: Build Windows release archive
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\Package-Release.ps1 -Version $version -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE "candidate")
      - name: Install pinned Codex CLI for archive lifecycle acceptance
        run: npm install --global @openai/codex@0.150.0-alpha.8
      - name: Verify the extracted Windows archive lifecycle
        working-directory: ${{ github.workspace }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $archive = Join-Path $env:GITHUB_WORKSPACE "candidate\runtime-evolution-workbench-$version.zip"
          $expected = (Get-Content "$archive.sha256").Split()[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Release archive checksum mismatch before acceptance." }
          $extractRoot = Join-Path $env:RUNNER_TEMP "runtime-release-install"
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $releaseRoot = Join-Path $extractRoot "runtime-evolution-workbench-$version"
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE "candidate\runtime-windows-installation-evidence.json"
          & (Join-Path $releaseRoot "scripts\Acceptance-InstallUninstall.ps1") -EvidencePath $evidencePath
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne "product.installation-acceptance.v2") { throw "Unsupported installation evidence schema." }
          if ($evidence.source_kind -ne "release_archive") { throw "Acceptance did not run from the release archive." }
          if ($evidence.tested_commit -ne $env:GITHUB_SHA) { throw "Archive commit does not match the release tag commit." }
          foreach ($check in @(
            "clean_isolated_codex_home",
            "failed_install_rolled_back",
            "failed_repair_restored_existing_install",
            "service_started",
            "loopback_only",
            "plugin_installed_enabled",
            "marketplace_registered",
            "startup_created_and_removed",
            "default_uninstall_preserved_data",
            "reinstall_preserved_data",
            "explicit_delete_removed_data",
            "final_plugin_absent",
            "final_marketplace_absent",
            "final_service_absent",
            "installation_state_audit_passed"
          )) {
            $property = $evidence.checks.PSObject.Properties[$check]
            if ($null -eq $property -or -not [bool]$property.Value) { throw "Installation evidence failed or omitted: $check" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-windows-candidate
          path: candidate
          if-no-files-found: error

  portable-package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: product
    steps:
      - name: Require public repository for provenance
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ("${{ github.event.repository.visibility }}" -ne "public") {
            throw "Publish the reviewed repository and enable public protections before pushing a release tag."
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Build, check, and package the portable archive
        run: |
          npm ci
          npm run check
          version="${GITHUB_REF_NAME#v}"
          node scripts/Package-Portable-Release.mjs --version "$version" --output "$GITHUB_WORKSPACE/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-portable-candidate
          path: candidate
          if-no-files-found: error

  portable-lifecycle:
    needs: portable-package
    name: portable ${{ matrix.platform }} archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.150.0-alpha.8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-portable-candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify and exercise the extracted portable archive
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          REW_PORTABLE_TEST_DATA_DIR: ${{ runner.temp }}/runtime-data
          REW_PORTABLE_EVIDENCE_DIR: ${{ runner.temp }}/runtime-portable-evidence
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/candidate/runtime-evolution-workbench-$version-portable.tar.gz"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"); const p=process.argv[1], e=fs.readFileSync(`${p}.sha256`,"utf8").trim().split(/\s+/)[0], a=crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); if(a!==e) process.exit(1)' "$archive"
          mkdir -p "$RUNNER_TEMP/extracted" "$CODEX_HOME"
          tar -xzf "$archive" -C "$RUNNER_TEMP/extracted"
          root="$RUNNER_TEMP/extracted/runtime-evolution-workbench-$version"
          chmod +x "$root"/scripts/*.sh
          cd "$root"
          ./scripts/Acceptance-Portable.sh
          mv "$REW_PORTABLE_EVIDENCE_DIR/running.json" "$REW_PORTABLE_EVIDENCE_DIR/runtime-${{ matrix.platform }}-running.json"
          mv "$REW_PORTABLE_EVIDENCE_DIR/absent.json" "$REW_PORTABLE_EVIDENCE_DIR/runtime-${{ matrix.platform }}-absent.json"
          mv "$REW_PORTABLE_EVIDENCE_DIR/uninstall.txt" "$REW_PORTABLE_EVIDENCE_DIR/runtime-${{ matrix.platform }}-uninstall.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.platform }}-archive-evidence
          path: ${{ runner.temp }}/runtime-portable-evidence
          if-no-files-found: error

  publish:
    needs: [windows-candidate, portable-package, portable-lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-windows-candidate
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-portable-candidate
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-linux-archive-evidence
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-macos-archive-evidence
          path: artifacts
      - name: Attest release evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.release.json
            artifacts/*-installation-evidence.json
            artifacts/*-running.json
            artifacts/*-absent.json
            artifacts/*-uninstall.txt
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notesFile = Join-Path $env:GITHUB_WORKSPACE "product/docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) { throw "Missing curated release notes: $notesFile" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts -File | ForEach-Object FullName) --repo "${{ github.repository }}" --verify-tag --notes-file $notesFile --prerelease --title "Runtime Evolution Workbench ${{ github.ref_name }}"
